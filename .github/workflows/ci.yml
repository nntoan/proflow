name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The test harness uses module.stripTypeScriptTypes (node >= 22.13).
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Unit + integration tests
        run: npm test

      - name: Pack sanity — the tarball must carry what the mod reads at runtime
        run: npm pack --dry-run
